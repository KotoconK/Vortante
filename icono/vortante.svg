<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo verde esperanto -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#00843D"/>
  <!-- Aro de la brújula -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  <!-- Aguja con forma de plumilla: norte dorado, sur blanco, ranura verde -->
  <g transform="rotate(45 256 256)">
    <polygon points="256,88 274,256 238,256" fill="#FFD23F"/>
    <polygon points="256,424 274,256 238,256" fill="#FFFFFF"/>
    <line x1="256" y1="150" x2="256" y2="236" stroke="#00843D" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Eje central -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="6" fill="#00843D"/>
</svg>
